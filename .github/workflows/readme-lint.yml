name: Docs lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Markdown lint
        run: |
          npx --yes markdownlint-cli@0.43.0 --disable MD013 MD041 README.md README.zh-CN.md docs/ \
            || npx --yes markdownlint-cli@0.43.0 --disable MD013 MD041 --ignore node_modules .
